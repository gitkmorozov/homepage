<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <title>Résumé</title>

    <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <div class="resume">
      <!-- Block 1: Header + avatar + contacts -->
      <div class="container">
        <div class="resume__block">
          <h1 class="contact-info__header">Your Name</h1>
          <h3 class="contact-info__sub-header">Your Title</h3>
          <div class="contact_info_container fh">
            <div class="contact-info__block">
              <!-- Contact items: location, linkedin, email, etc. -->
            </div>
            <div class="contact-info__block contact-info__block--center">
              <img class="contact-info__avatar" src="assets/avatar.png" alt="Avatar" />
            </div>
            <div class="contact-info__block">
              <!-- More contact items -->
            </div>
          </div>
        </div>
      </div>

      <!-- Block 2: Intro -->
      <div class="container">
        <div class="resume__block">
          <div class="intro">
            <!-- intro icon + text from task -->
          </div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
